# The Proxmox VE hypervisor (proxmox0, 192.168.6.2).
#
# So far this only covers the off-site NAS copy (borg to the Hetzner Storage
# Box). Still configured by hand and to be codified here: PBS CT 105, the
# nightly-vms job and vzdump hook, pve-host-backup, borg-pbs-offsite and the
# Kuma env files in /etc/default.
#
# Run (root login over the gpg-agent key, "| cat" because ansible refuses
# non-blocking stdout):
#   export SSH_AUTH_SOCK=$XDG_RUNTIME_DIR/gnupg/S.gpg-agent.ssh
#   ansible-playbook proxmox.yml --check --diff | cat
#   ansible-playbook proxmox.yml | cat

- name: Configure the Proxmox host
  hosts: proxmox
  become: false
  tags:
    - borg

  vars:
    nas_host: 192.168.6.220
    nas_clone_datasets: [microservices, mikkel, haosBackups]

  tasks:
    # The TrueNAS cron job "snapshot-clone" (03:15) clones the newest snapshot of
    # each dataset to HDDs/offsite-clones/<ds>, shared read-only to this host.
    - name: Create the NAS mount points
      ansible.builtin.file:
        path: "/mnt/nas/{{ item }}"
        state: directory
        mode: '0755'
      loop: "{{ nas_clone_datasets }}"

    - name: Mount the NAS snapshot clones on demand
      ansible.builtin.blockinfile:
        path: /etc/fstab
        marker: "# borg-nas-offsite ({mark})"
        marker_begin: begin
        marker_end: end
        block: |
          {% for ds in nas_clone_datasets %}
          {{ nas_host }}:/mnt/HDDs/offsite-clones/{{ ds }} /mnt/nas/{{ ds }} nfs ro,nfsvers=4,soft,timeo=150,retrans=3,_netdev,nofail,noauto,x-systemd.automount,x-systemd.idle-timeout=600,x-systemd.mount-timeout=60 0 0
          {% endfor %}
      register: nas_fstab

    - name: Reload systemd and restart the NAS automounts
      ansible.builtin.shell: |
        systemctl daemon-reload
        for ds in {{ nas_clone_datasets | join(' ') }}; do
          systemctl stop mnt-nas-$ds.mount 2>/dev/null
          systemctl restart mnt-nas-$ds.automount
        done
      when: nas_fstab.changed

    # /etc/default/borg-nas-offsite (KUMA_PUSH_URL, UPLOAD_RATE_KIB), the ssh key
    # and the borg passphrase file are secrets and stay on the host.
    - name: Install the NAS off-site borg script
      ansible.builtin.copy:
        src: files/proxmox/borg-nas-offsite
        dest: /usr/local/sbin/borg-nas-offsite
        owner: root
        group: root
        mode: '0755'

    - name: Install the NAS off-site service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/borg-nas-offsite.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Off-site copy of the NAS datasets to the Hetzner Storage Box (borg)
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/borg-nas-offsite
          TimeoutStartSec=infinity
          Nice=10
          IOSchedulingClass=idle
      notify: Reload systemd

    - name: Install the NAS off-site timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/borg-nas-offsite.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Nightly off-site copy of the NAS datasets

          [Timer]
          OnCalendar=*-*-* 03:30:00
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    - name: Enable and start the NAS off-site timer
      ansible.builtin.systemd_service:
        name: borg-nas-offsite.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
