- name: Install sopel (libera)
  hosts: homeserver
  become: true
  tags:
    - irc
    - sopel
    - libera
  
  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml
  
  tasks:
    - name: Create sopel volume
      community.docker.docker_volume:
        name: sopel_data
    
    - name: Get volume path
      community.docker.docker_volume_info:
        name: sopel_data
      register: sopel_data_volume_info

    - name: Set up folders
      file:
        path: '{{ item }}'
        owner: '100000'
        group: '100000'
        state: directory
      loop:
        - '{{ sopel_data_volume_info.volume.Mountpoint }}'
        - '{{ sopel_data_volume_info.volume.Mountpoint }}/log'


    - name: Copy config to docker volume
      template:
        src: templates/sopel/default.cfg.j2
        dest: '{{ sopel_data_volume_info.volume.Mountpoint }}/default.cfg'
        owner: '100000'
        group: '100000'

    - name: Start sopel container
      community.docker.docker_container:
        name: sopel-libera
        image: sopelirc/sopel:latest
        pull: yes
        networks:
          - name: bridge
        networks_cli_compatible: yes
        network_mode: default
        restart_policy: 'unless-stopped'
        volumes:
          - 'sopel_data:/home/sopel/.sopel'
        env:
            EXTRA_PYPI_PACKAGES: sopel-wolfram sopel-youtube
        
        container_default_behavior: 'no_defaults'
        tty: no
        read_only: no
        privileged: no
        paused: no
        memory: "0"
        interactive: no
        init: no
        detach: yes
        auto_remove: no

- name: Install Immich
  hosts: homeserver
  become: true
  tags:
    - immich
  
  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml
  
  tasks:
    - name: Create directory for docker-compose files
      ansible.builtin.file:
        path: /opt/immich_compose
        state: directory
    
    - name: Transfer .env config
      ansible.builtin.template:
        src: "templates/immich/.env.j2"
        dest: "/opt/immich_compose/.env"

    - name: Get immich docker compose file
      ansible.builtin.get_url:
        url: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
        dest: /opt/immich_compose/docker-compose.yml 

    - name: docker-compose up
      community.docker.docker_compose_v2:
        project_src: /opt/immich_compose
      register: output
    
    - name: Compose output
      ansible.builtin.debug:
        var: output

- name: Install Uptime Kuma (status2.mikkel.cc)
  hosts: homeserver
  become: True
  tags:
    - kuma
    - status
    - uptime

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  vars:
    kuma_version: '2.5.6'
    # The sites Caddy serves on this host. Kuma resolves them to the docker
    # host (Caddy), so a monitor of https://paste.mikkel.cc/ tests the real
    # Caddy site and certificate over the LAN without depending on hairpin NAT
    # or public DNS. The external Kuma (watch.mikkel.cc) tests the public path.
    kuma_local_hosts:
      - mikkel.cc
      - blog.mikkel.cc
      - wifir.mikkel.cc
      - webhooks.mikkel.cc
      - paste.mikkel.cc
      - sche.cc
      - snuletek.org
      - lounge.mikkel.cc
      - lounge.snuletek.org
      - nextcloud.mikkel.cc
      - immich.mikkel.cc
      - unifi.mikkel.cc
      - ubnt.mikkel.cc
      - joplin.mikkel.cc

  tasks:
    # SQLite: the data volume stays on the VM's local disk (Kuma does not
    # support NFS for its database). VM 101 is backed up nightly by PBS.
    - name: Create the Uptime Kuma data volume
      community.docker.docker_volume:
        name: uptime_kuma_data
        labels:
          application: "uptime-kuma"
          managed_by: "ansible"

    - name: Start Uptime Kuma
      community.docker.docker_container:
        name: uptime-kuma
        image: 'louislam/uptime-kuma:{{ kuma_version }}'
        ports:
          - '127.0.0.1:{{ portmap.kuma.webui }}:3001'
        network_mode: bridge
        restart_policy: 'unless-stopped'
        volumes:
          - 'uptime_kuma_data:/app/data'
        etc_hosts: "{{ dict(kuma_local_hosts | zip_longest([], fillvalue='host-gateway')) }}"

        container_default_behavior: 'no_defaults'
        detach: yes

- name: Install bepasty (paste.mikkel.cc)
  hosts: homeserver
  become: True
  tags:
    - bepasty
    - pastebin

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  tasks:
    # The container runs as root and keeps its generated bepasty.conf, the logs
    # and the uploads (storage/) in the volume. Restore the VPS data into this
    # folder before pointing DNS here.
    - name: Create the local folder for bepasty data
      ansible.builtin.file:
        path: /mnt/hexos/bepasty
        state: directory
        mode: '0755'

    - name: Create bepasty data volume
      community.docker.docker_volume:
        name: bepasty_data
        driver: local
        driver_options:
          device: /mnt/hexos/bepasty
          type: "none"
          o: bind
        state: present
        labels:
          application: "bepasty"
          managed_by: "ansible"

    - name: Start bepasty container
      community.docker.docker_container:
        name: bepasty
        image: duckle/bepasty:stable
        ports:
          - '127.0.0.1:{{ portmap.bepasty[0] }}:5000'
        network_mode: bridge
        restart_policy: 'unless-stopped'
        volumes:
          - 'bepasty_data:/srv/bepasty'
        # The values carry literal single quotes on purpose: the image writes
        # them into a python config file (same as on the VPS).
        env:
          STORAGE_FILESYSTEM_DIRECTORY: "'/srv/bepasty/storage'"
          SITENAME: "'paste.{{ domain }}'"
          UPLOAD_LOCKED: 'False'
          MAX_ALLOWED_FILE_SIZE: '5 * 1000 * 1000 * 1000'
          MAX_BODY_SIZE: '1 * 1024 * 1024'
          STORAGE: "'filesystem'"
          SECRET_KEY: "'{{ credentials.bepasty.secret }}'"
          SESSION_COOKIE_SECURE: 'True'
          PERMANENT_SESSION: 'False'
          PERMANENT_SESSION_LIFETIME: '31 * 24 * 3600'
          DEFAULT_PERMISSIONS: "'read'"
          PERMISSIONS: "{{ credentials.bepasty.permissions | join(', ') }}"

        container_default_behavior: 'no_defaults'
        tty: no
        read_only: no
        privileged: no
        paused: no
        memory: "0"
        interactive: no
        init: no
        detach: yes
        auto_remove: no

- name: Install Shlink (sche.cc)
  hosts: homeserver
  become: True
  tags:
    - shlink
    - urlshort

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  vars:
    shlink_version: '5.1.7'
    shlink_mariadb_version: '11.4'

  tasks:
    - name: Create shlink network
      community.docker.docker_network:
        name: shlink

    # MariaDB stays on the VM's local disk (not NFS: locking and fsync latency),
    # which the nightly PBS backup of VM 101 covers.
    - name: Create shlink database volume
      community.docker.docker_volume:
        name: shlink_db
        labels:
          application: "shlink"
          managed_by: "ansible"

    - name: Start the shlink database
      community.docker.docker_container:
        name: shlink-mariadb
        image: 'mariadb:{{ shlink_mariadb_version }}'
        command: '--transaction-isolation=READ-COMMITTED --binlog-format=ROW'
        networks:
          - name: shlink
        restart_policy: 'unless-stopped'
        volumes:
          - 'shlink_db:/var/lib/mysql'
        env:
          MARIADB_ROOT_PASSWORD: '{{ credentials.shlink.mysql_root_pass }}'
          MARIADB_PASSWORD: '{{ credentials.shlink.database_pass }}'
          MARIADB_DATABASE: 'shlink'
          MARIADB_USER: 'shlink'

        container_default_behavior: 'no_defaults'
        detach: yes

    - name: Start Shlink container
      community.docker.docker_container:
        name: shlink
        image: 'shlinkio/shlink:{{ shlink_version }}'
        networks:
          - name: shlink
        ports:
          - '127.0.0.1:{{ portmap.shlink[0] }}:8080'
        restart_policy: 'unless-stopped'
        env:
          DEFAULT_DOMAIN: '{{ shlink_domain }}'
          IS_HTTPS_ENABLED: 'true'
          TIMEZONE: 'Europe/Copenhagen'
          GEOLITE_LICENSE_KEY: '{{ credentials.shlink.geolite_token }}'
          DB_DRIVER: 'maria'
          DB_NAME: 'shlink'
          DB_USER: 'shlink'
          DB_PASSWORD: '{{ credentials.shlink.database_pass }}'
          DB_HOST: 'shlink-mariadb'
          DISABLE_TRACK_PARAM: 'no-track'
          # Caddy is the one proxy in front of Shlink; it sets X-Forwarded-For
          # to the real visitor (see templates/caddy/sites/shlink.Caddyfile.j2).
          # Shlink 5 no longer detects proxies on its own.
          TRUSTED_PROXIES: '1'

        container_default_behavior: 'no_defaults'
        detach: yes

- name: Deploy webhook based websites (resume, blog, wifir)
  hosts: homeserver
  become: true
  tags:
    - webhook
    - websites

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  vars:
    wh_server_config: 'templates/webhook_server_config.ini.j2'
    wh_server_file_group: 'caddy'
    wh_server_port: '{{ portmap.webhook_serv[0] }}'
    wh_server_webroots:
      - '{{ mikkelcc_webroot }}'
      - '{{ blog_webroot }}'
      - '{{ wifir_webroot }}'
    # 0.168.0 needs two changes in the blog repo: `[pagination] pagerSize`
    # instead of `paginate`, and `css.Sass` instead of `resources.ToCSS` in the
    # m10c theme's baseof.html. The VPS used 0.68.3, which builds the unpatched
    # repo with byte-identical output but cannot build the patched one. Push the
    # blog patch only after this version is installed (rerun --tags webhook).
    hugo_version: '0.168.0'
    hugo_checksum: 'sha256:787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53'

  tasks:
    - name: Read the installed hugo version
      ansible.builtin.command: /usr/local/bin/hugo version
      register: hugo_installed
      changed_when: false
      failed_when: false

    - name: Download hugo (extended)
      ansible.builtin.get_url:
        url: 'https://github.com/gohugoio/hugo/releases/download/v{{ hugo_version }}/hugo_extended_{{ hugo_version }}_linux-amd64.tar.gz'
        dest: '/var/tmp/hugo_extended_{{ hugo_version }}.tar.gz'
        checksum: '{{ hugo_checksum }}'
        mode: '0644'
      when: ('v' ~ hugo_version ~ '-') not in hugo_installed.stdout

    - name: Install hugo
      ansible.builtin.unarchive:
        src: '/var/tmp/hugo_extended_{{ hugo_version }}.tar.gz'
        dest: /usr/local/bin
        include: hugo
        remote_src: true
      when: ('v' ~ hugo_version ~ '-') not in hugo_installed.stdout

    - name: Ensure the webhook user exists before the webroots
      ansible.builtin.user:
        name: gunicorn
        password: '!'
        home: /srv/webhook_server
        create_home: false
        system: true

    # The server clones into these on first start, so they have to exist and
    # be writable by it. Caddy only reads them.
    - name: Ensure webroots are present
      ansible.builtin.file:
        group: caddy
        owner: gunicorn
        path: '{{ item }}'
        state: directory
        mode: '0755'
      loop:
        - '{{ mikkelcc_webroot }}'
        - '{{ blog_webroot }}'
        - '{{ wifir_webroot }}'

    - name: Install webhook server
      ansible.builtin.include_role:
        name: webhook_server

- name: Deploy snuletek.org
  hosts: homeserver
  become: true
  tags:
    - snuletek

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml

  tasks:
    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present

    # A plain checkout on the VM's own disk (it is reproducible from GitHub, so
    # it needs no NFS and no backup). Upstream has not changed since 2021, so
    # this only does something when the repo is pushed to again.
    - name: Get website
      ansible.builtin.git:
        repo: https://github.com/Duckle29/snuletek.git
        dest: '{{ snuletekorg_webroot }}'
        update: yes

    # PHP 7.4 on the VPS was end of life. The 20 pages are plain includes and
    # session_start; they lint clean and render without warnings on 8.4.
    - name: Start php-apache container
      community.docker.docker_container:
        name: snuletek-php-apache
        image: php:8.4-apache
        pull: yes
        ports:
          - '127.0.0.1:{{ portmap.snuletek[0] }}:80'
        network_mode: bridge
        restart_policy: 'unless-stopped'
        volumes:
          - '{{ snuletekorg_webroot }}:/var/www/html:ro'

        container_default_behavior: 'no_defaults'
        tty: no
        read_only: no
        privileged: no
        paused: no
        memory: "0"
        interactive: no
        init: no
        detach: yes
        auto_remove: no
