- name: Install sopel (libera)
  hosts: homeserver
  become: true
  tags:
    - irc
    - sopel
    - libera
  
  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml
  
  tasks:
    - name: Create sopel volume
      community.docker.docker_volume:
        name: sopel_data
    
    - name: Get volume path
      community.docker.docker_volume_info:
        name: sopel_data
      register: sopel_data_volume_info

    - name: Set up folders
      file:
        path: '{{ item }}'
        owner: '100000'
        group: '100000'
        state: directory
      loop:
        - '{{ sopel_data_volume_info.volume.Mountpoint }}'
        - '{{ sopel_data_volume_info.volume.Mountpoint }}/log'


    - name: Copy config to docker volume
      template:
        src: templates/sopel/default.cfg.j2
        dest: '{{ sopel_data_volume_info.volume.Mountpoint }}/default.cfg'
        owner: '100000'
        group: '100000'

    - name: Start sopel container
      community.docker.docker_container:
        name: sopel-libera
        image: sopelirc/sopel:latest
        pull: yes
        networks:
          - name: bridge
        networks_cli_compatible: yes
        network_mode: default
        restart_policy: 'unless-stopped'
        volumes:
          - 'sopel_data:/home/sopel/.sopel'
        env:
            EXTRA_PYPI_PACKAGES: sopel-wolfram sopel-youtube
        
        container_default_behavior: 'no_defaults'
        tty: no
        read_only: no
        privileged: no
        paused: no
        memory: "0"
        interactive: no
        init: no
        detach: yes
        auto_remove: no

- name: Install Immich
  hosts: homeserver
  become: true
  tags:
    - immich
  
  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml
  
  tasks:
    - name: Create directory for docker-compose files
      ansible.builtin.file:
        path: /opt/immich_compose
        state: directory
    
    - name: Transfer .env config
      ansible.builtin.template:
        src: "templates/immich/.env.j2"
        dest: "/opt/immich_compose/.env"

    - name: Get immich docker compose file
      ansible.builtin.get_url:
        url: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
        dest: /opt/immich_compose/docker-compose.yml 

    - name: docker-compose up
      community.docker.docker_compose_v2:
        project_src: /opt/immich_compose
      register: output
    
    - name: Compose output
      ansible.builtin.debug:
        var: output

- name: Install CIAO update page
  hosts: homeserver
  become: True
  tags:
    - ciao
    - status
    - uptime

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  tasks:
    # todo: Remember to chmod 'o+x' all the folders leading to the upload dir
    - name: Create local folder for volume
      ansible.builtin.file:
        path: /mnt/hexos/ciao
        state: directory
        mode: '0755'
        owner: '1000'
        group: '1000'

    - name: Create ciao data volume
      community.docker.docker_volume:
        name: ciao_data
        driver: local
        driver_options:
          device: /mnt/hexos/ciao
          type: "none"
          o: bind
        state: present
        labels:
          application: "ciao"
          managed_by: "ansible"

    - name: Start ciao container
      community.docker.docker_container:
        name: ciao
        image: brotandgames/ciao:latest
        ports: 
          - '{{ portmap.ciao.webui }}:3000'
        network_mode: bridge
        restart_policy: 'unless-stopped'
        volumes:
          - 'ciao_data:/app/db/sqlite'
        env:
          SECRET_KEY_BASE: "{{ credentials.ciao.secret_key_base }}"
          SMTP_ADDRESS: "smtp.migadu.com"
          SMTP_EMAIL_FROM: "{{ credentials.ciao.smtp.from }}"
          SMTP_EMAIL_TO: "{{ credentials.ciao.smtp.to }}"
          SMTP_PORT: "465"
          SMTP_DOMAIN: "{{ domain }}"
          SMTP_AUTHENTICATION: "plain"
          SMTP_ENABLE_STARTTLS_AUTO: "false"
          SMTP_USERNAME: "{{ credentials.ciao.smtp.from }}"
          SMTP_PASSWORD: "{{ credentials.ciao.smtp.password }}"
          SMTP_SSL: "true"
          TIME_ZONE: "Copenhagen"
          BASIC_AUTH_USERNAME: "{{ credentials.ciao.auth.user }}"
          BASIC_AUTH_PASSWORD: "{{ credentials.ciao.auth.pass }}"
          
        container_default_behavior: 'no_defaults'
        tty: no
        read_only: no
        privileged: no
        paused: no
        memory: "0"
        interactive: no
        init: no
        detach: yes
        auto_remove: no

