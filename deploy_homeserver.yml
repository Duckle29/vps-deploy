---
# https://oneuptime.com/blog/post/2026-02-21-how-to-use-the-ansible-raw-module-for-bootstrapping/view
- name: Raw bootstrap (no Python required)
  hosts: homeserver
  gather_facts: false
  tags:
    - dependencies
    - python

  tasks:
    - name: Update package cache and install Python
      ansible.builtin.raw: |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y -qq python3 python3-apt sudo
        elif command -v yum >/dev/null 2>&1; then
          yum install -y python3 sudo
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3 sudo
        fi
      register: install_result
      changed_when: install_result.rc == 0

    - name: Create ansible temp directory
      ansible.builtin.raw: "mkdir -p /root/.ansible/tmp && chmod 700 /root/.ansible/tmp"
      changed_when: false

    - name: Verify Python is working
      ansible.builtin.raw: |
        python3 -c "import json; print(json.dumps({'status': 'ok'}))"
      register: python_test
      changed_when: false
      failed_when: "'ok' not in python_test.stdout"

- name: Proxmox guest agent
  hosts: homeserver
  become: true
  tags:
    - dependencies
    - guest-agent

  tasks:
    # This host is a Proxmox VM. The agent lets Proxmox freeze the filesystems
    # for consistent backups and shut the VM down cleanly. It needs `agent: 1`
    # on the VM in Proxmox and a full stop/start of the VM to take effect.
    # The unit is static: udev starts it once the virtio channel exists.
    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Install and set up Docker-CE
  hosts: homeserver
  become: true
  tags:
    - dependencies
    - docker

  vars:
    docker_sdk: true
    docker_compose: true
  
  roles:
    - haxorof.docker_ce

- name: Install Caddy
  hosts: homeserver
  become: true
  tags:
    - caddy
    - ssl
    - proxy

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml
    - vars/cloudflare_ips.yml

  handlers:
    # Replacing the binary needs a restart; a reload keeps the running one.
    # Defined first so it runs before the reload handler.
    - name: Restart caddy
      ansible.builtin.service:
        name: caddy
        state: restarted

    - name: Reload caddy
      ansible.builtin.service:
        name: caddy
        state: reloaded

  tasks:
    - name: Ensure thirdpardy keyring/repo related packages are installed
      ansible.builtin.apt:
        update_cache: yes
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
        state: present

    - name: Add Cloudsmith repo key
      ansible.builtin.apt_key:
        url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
        state: present

    - name: Add Caddy repository to sources list
      ansible.builtin.apt_repository:
        repo:
          "deb https://dl.cloudsmith.io/public/caddy/stable/deb/debian
          any-version main"
        state: present
        filename: caddy-stable

    - name: Add Caddy src repository to sources list
      ansible.builtin.apt_repository:
        repo:
          "deb-src https://dl.cloudsmith.io/public/caddy/stable/deb/debian
          any-version main"
        state: present
        filename: caddy-stable

    - name: Install Caddy
      ansible.builtin.apt:
        update_cache: yes
        name: caddy
        state: present
    
    - name: Ensure golang is installed
      ansible.builtin.apt:
        update_cache: yes
        name:
          - golang-go
        state: present

    - name: Install xcaddy
      ansible.builtin.apt:
        deb: https://github.com/caddyserver/xcaddy/releases/download/v0.4.5/xcaddy_0.4.5_linux_amd64.deb

    - name: Check caddy version
      ansible.builtin.shell: caddy version
      changed_when: no
      failed_when: no
      register: caddy_version_output

    - name: Extract clean version number
      ansible.builtin.set_fact:
        current_caddy_version: "{{ caddy_version_output.stdout | split | first }}"

    # The binary is built from Caddy plus the Cloudflare DNS plugin, so a plugin
    # version change must trigger a rebuild too, not only a Caddy version change.
    # The build id of what is installed is kept in a small marker file.
    - name: Read the installed Caddy build id
      ansible.builtin.slurp:
        src: /usr/local/share/caddy-build-id
      register: caddy_build_marker
      failed_when: false

    - name: Decide whether Caddy needs to be (re)built
      ansible.builtin.set_fact:
        caddy_build_id: "{{ caddy_version }}+caddy-dns-cloudflare-{{ caddy_cloudflare_plugin_version }}"
        caddy_needs_build: >-
          {{ current_caddy_version is ansible.builtin.version(caddy_version, '!=')
             or ((caddy_build_marker.content | default('') | b64decode | trim)
                 != (caddy_version ~ '+caddy-dns-cloudflare-' ~ caddy_cloudflare_plugin_version)) }}

    - ansible.builtin.debug:
        msg: "Current Caddy: {{ caddy_version_output.stdout }}; building {{ caddy_build_id }}"
      when: caddy_needs_build | bool

    - ansible.builtin.debug:
        msg: "Caddy build already correct: {{ caddy_build_id }}"
      when: not (caddy_needs_build | bool)

    - name: Make temp build directory
      ansible.builtin.tempfile:
        state: directory
        suffix: build
      register: build_dir
      when: caddy_needs_build | bool

    - name: Build caddy with Cloudflare DNS plugin
      ansible.builtin.shell:
        chdir: "{{ build_dir.path }}"
        cmd: "xcaddy build {{ caddy_version }} --with github.com/caddy-dns/cloudflare@{{ caddy_cloudflare_plugin_version }}"
      when: caddy_needs_build | bool

    - name: DPKG divert for custom caddy build
      community.general.dpkg_divert:
        path: /usr/bin/caddy
        divert: /usr/bin/caddy.default
        rename: true
      when: build_dir.path is defined
    
    - name: Move built binary into place
      ansible.builtin.copy:
        remote_src: yes
        mode: preserve
        src: "{{ build_dir.path }}/caddy"
        dest: /usr/bin/caddy.custom
      when: build_dir.path is defined
      notify: Restart caddy

    - name: Record the installed Caddy build id
      ansible.builtin.copy:
        content: "{{ caddy_build_id }}\n"
        dest: /usr/local/share/caddy-build-id
        owner: root
        group: root
        mode: '0644'
      when: build_dir.path is defined

    - name: Remove build tempdir
      ansible.builtin.file:
        path: "{{ build_dir.path }}"
        state: absent
      when: build_dir.path is defined

    - name: Update-alternatives for caddy
      community.general.alternatives:
        link: /usr/bin/caddy
        name: caddy
        path: "{{ item[0] }}"
        priority: "{{ item[1]}}"
        state: present
      loop:
        - ["/usr/bin/caddy.default", 10]
        - ["/usr/bin/caddy.custom", 50]
      when: caddy_needs_build | bool

    # The Cloudflare token (DNS-01 challenge) lives in a root-only environment
    # file that systemd loads into the service, and the Caddyfiles refer to it
    # as {env.CLOUDFLARE_API_TOKEN}. It never appears in a (world-readable)
    # Caddyfile, and rotating it is "edit credentials.yml, run --tags caddy".
    - name: Store the Cloudflare API token for Caddy (root-only)
      ansible.builtin.copy:
        dest: /etc/caddy/caddy.env
        owner: root
        group: root
        mode: '0600'
        content: |
          CLOUDFLARE_API_TOKEN={{ credentials.caddy.cloudflare_zone_api_token }}
      no_log: true
      notify: Restart caddy

    - name: Create the Caddy service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/caddy.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Load the Caddy environment file in the service
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy.service.d/10-cloudflare-env.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible (deploy_homeserver.yml)
          [Service]
          EnvironmentFile=/etc/caddy/caddy.env
      register: caddy_env_dropin
      notify: Restart caddy

    - name: Reload systemd units for the Caddy drop-in
      ansible.builtin.systemd:
        daemon_reload: true
      when: caddy_env_dropin is changed

    - name: Enable and start Caddy service
      ansible.builtin.service:
        name: caddy
        enabled: yes
        state: started
      when: caddy_version_output.rc == 0

    - name: Transfer the main Caddyfile
      ansible.builtin.template:
        src: templates/caddy/main.Caddyfile.j2
        dest: /etc/caddy/Caddyfile
      notify: Reload caddy

    - name: Create directory for sub-sites
      ansible.builtin.file:
        path: /etc/caddy/sites
        state: directory

- name: Deploy Caddy site configs
  hosts: homeserver
  become: True
  tags:
    - sites
    - caddy
    - proxy

  handlers:
    - name: Reload caddy
      ansible.builtin.service:
        name: caddy
        state: reloaded

  vars_files:
    - vars/port_usage.yml
    - vars/shared_vars.yml
    - vars/credentials.yml

  tasks:
      # Deploys all .Caddyfile.j2 files in templates/caddy/sites
    - name: Deploy site configs
      template:
        src: '{{ item }}'
        dest: '/etc/caddy/sites/{{ (item | basename | splitext)[0] }}'
      with_fileglob:
        - templates/caddy/sites/*.Caddyfile.j2
      notify:
        - Reload caddy

- name: Network storage
  hosts: homeserver
  become: true
  tags:
    - storage

  tasks:
    - name: Install NFS dependencies
      ansible.builtin.package:
        name: nfs-common
        state: present

    # The NAS is a VM on the same Proxmox host and can come up after this VM
    # (power cut, host reboot). _netdev orders the mount after the network,
    # the long mount timeout lets systemd keep retrying until the NAS answers,
    # and nofail keeps a missing NAS from dropping boot into emergency mode.
    - name: Setup and mount NAS share
      ansible.posix.mount:
        src: hexos1.home:/mnt/HDDs/microservices
        path: /mnt/hexos
        boot: yes
        fstype: nfs
        state: mounted
        opts: rw,sync,hard,_netdev,nofail,x-systemd.mount-timeout=600

    # Docker must not start before the share is there: containers with bind
    # mounts under /mnt/hexos would otherwise fail or, for plain host-path
    # binds, start on an empty directory on the local disk.
    - name: Create the Docker drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Make Docker wait for the NAS share
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/10-wait-for-nfs.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible (deploy_homeserver.yml)
          [Unit]
          RequiresMountsFor=/mnt/hexos
      register: docker_nfs_dropin

    # Only reloads unit files. It does not restart Docker (and its containers);
    # the drop-in takes effect the next time Docker starts.
    - name: Reload systemd units
      ansible.builtin.systemd:
        daemon_reload: true
      when: docker_nfs_dropin is changed

- name: Install Nextcloud AiO
  hosts: homeserver
  become: True
  tags:
    - nextcloud

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  tasks:
    - name: Create nextcloud network
      community.docker.docker_network:
        name: nextcloud

    - name: Create the local folder the nextcloud data dir
      ansible.builtin.file:
        path: /mnt/hexos/nextcloud
        state: directory
        mode: '0750'
        owner: 'www-data'
        group: 'root'

    - name: Create nextcloud data volume
      community.docker.docker_volume:
        name: nextcloud_aio_nextcloud_datadir
        driver: local
        driver_options:
          device: /mnt/hexos/nextcloud
          type: "none"
          o: bind
        state: present
        labels:
          application: "nextcloud"
          managed_by: "ansible"
    
    - name: Create nextcloud config volume
      community.docker.docker_volume:
        name: nextcloud_aio_mastercontainer
        state: present
        labels:
          application: "nextcloud"
          managed_by: "ansible"

    - name: Start Nextcloud AiO
      community.docker.docker_container:
        name: nextcloud-aio-mastercontainer
        image: ghcr.io/nextcloud-releases/all-in-one:latest
        init: true
        restart_policy: 'unless-stopped'
        ports:
          - '{{ portmap.nextcloud.AIO_MGMT }}:8080'
        networks:
          - name: nextcloud
          - name: bridge

        volumes:
          - 'nextcloud_aio_mastercontainer:/mnt/docker-aio-config'
          - '/var/run/docker.sock:/var/run/docker.sock:ro'
        env:
            NEXTCLOUD_DATADIR: 'nextcloud_aio_nextcloud_datadir'
            APACHE_PORT: "{{ portmap.nextcloud.APACHE | string }}"
            APACHE_IP_BINDING: '0.0.0.0'
            APACHE_ADDITIONAL_NETWORK: ''
            SKIP_DOMAIN_VALIDATION: 'false'
            TALK_PORT: "{{ portmap.nextcloud.TALK | string }}"

        # Defaults
        auto_remove: false
        detach: true
        interactive: false
        memory: "0"
        paused: false
        privileged: false
        read_only: false
        tty: false

- name: Install thelounge (docker)
  hosts: homeserver
  become: True
  tags:
    - thelounge
    - irc

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  tasks:
    # todo: Remember to chmod 'o+x' all the folders leading to the upload dir
    - name: Create the local folder for thelounge data
      ansible.builtin.file:
        path: /mnt/hexos/thelounge
        state: directory
        mode: '0755'
        owner: '1000'
        group: '1000'

    - name: Create thelounge data volume
      community.docker.docker_volume:
        name: thelounge_data
        driver: local
        driver_options:
          device: /mnt/hexos/thelounge
          type: "none"
          o: bind
        state: present
        labels:
          application: "thelounge"
          managed_by: "ansible"
        
    - name: Get data volume path
      community.docker.docker_volume_info:
        name: thelounge_data
      register: thelounge_data_volume_info
    
    - name: Set up config
      template:
        src: templates/thelounge/config.js.j2
        dest: '/mnt/hexos/thelounge/config.js'

    - name: Start thelounge container
      community.docker.docker_container:
        name: thelounge
        image: ghcr.io/thelounge/thelounge:4.5.2
        ports: 
          - '{{ portmap.thelounge[0] }}:9000'
        network_mode: bridge
        restart_policy: 'unless-stopped'
        volumes:
          - 'thelounge_data:/var/opt/thelounge'
      
        container_default_behavior: 'no_defaults'
        tty: no
        read_only: no
        privileged: no
        paused: no
        memory: "0"
        interactive: no
        init: no
        detach: yes
        auto_remove: no

