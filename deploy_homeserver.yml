---
# https://oneuptime.com/blog/post/2026-02-21-how-to-use-the-ansible-raw-module-for-bootstrapping/view
- name: Raw bootstrap (no Python required)
  hosts: homeserver
  gather_facts: false
  tags:
    - dependencies
    - python

  tasks:
    - name: Update package cache and install Python
      ansible.builtin.raw: |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y -qq python3 python3-apt sudo
        elif command -v yum >/dev/null 2>&1; then
          yum install -y python3 sudo
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3 sudo
        fi
      register: install_result
      changed_when: install_result.rc == 0

    - name: Create ansible temp directory
      ansible.builtin.raw: "mkdir -p /root/.ansible/tmp && chmod 700 /root/.ansible/tmp"
      changed_when: false

    - name: Verify Python is working
      ansible.builtin.raw: |
        python3 -c "import json; print(json.dumps({'status': 'ok'}))"
      register: python_test
      changed_when: false
      failed_when: "'ok' not in python_test.stdout"

- name: Install and set up Docker-CE
  hosts: homeserver
  become: true
  tags:
    - dependencies
    - docker

  vars:
    docker_sdk: true
    docker_compose: true
  
  roles:
    - haxorof.docker_ce

- name: Install Caddy
  hosts: homeserver
  become: true
  tags:
    - caddy
    - ssl
    - proxy

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  handlers:
    - name: Reload caddy
      ansible.builtin.service:
        name: caddy
        state: reloaded

  tasks:
    - name: Ensure thirdpardy keyring/repo related packages are installed
      ansible.builtin.apt:
        update_cache: yes
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
        state: present

    - name: Add Cloudsmith repo key
      ansible.builtin.apt_key:
        url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
        state: present

    - name: Add Caddy repository to sources list
      ansible.builtin.apt_repository:
        repo:
          "deb https://dl.cloudsmith.io/public/caddy/stable/deb/debian
          any-version main"
        state: present
        filename: caddy-stable

    - name: Add Caddy src repository to sources list
      ansible.builtin.apt_repository:
        repo:
          "deb-src https://dl.cloudsmith.io/public/caddy/stable/deb/debian
          any-version main"
        state: present
        filename: caddy-stable

    - name: Install Caddy
      ansible.builtin.apt:
        update_cache: yes
        name: caddy
        state: present
    
    - name: Ensure golang is installed
      ansible.builtin.apt:
        update_cache: yes
        name:
          - golang-go
        state: present

    - name: Install xcaddy
      ansible.builtin.apt:
        deb: https://github.com/caddyserver/xcaddy/releases/download/v0.4.5/xcaddy_0.4.5_linux_amd64.deb

    - name: Check caddy version
      ansible.builtin.shell: caddy version
      changed_when: no
      failed_when: no
      register: caddy_version_output

    - name: Extract clean version number
      ansible.builtin.set_fact:
        current_caddy_version: "{{ caddy_version_output.stdout | split | first }}"

    - ansible.builtin.debug:
        msg: "Current Caddy version: {{ caddy_version_output.stdout }} building requested new version {{ caddy_version }}"
      when: current_caddy_version is ansible.builtin.version(caddy_version, '!=')
    
    - ansible.builtin.debug:
        msg: "Current Caddy version already correct: {{ caddy_version_output.stdout }} "
      when: current_caddy_version is ansible.builtin.version(caddy_version, '==')

    - name: Make temp build directory
      ansible.builtin.tempfile:
        state: directory
        suffix: build
      register: build_dir
      when: current_caddy_version is ansible.builtin.version(caddy_version, '!=')

    - name: Build caddy with Cloudflare DNS plugin
      ansible.builtin.shell: 
        chdir: "{{ build_dir.path }}"
        cmd: xcaddy build --with github.com/caddy-dns/cloudflare@v0.2.3
      when: current_caddy_version is ansible.builtin.version(caddy_version, '!=')
    
    - name: DPKG divert for custom caddy build
      community.general.dpkg_divert:
        path: /usr/bin/caddy
        divert: /usr/bin/caddy.default
        rename: true
      when: build_dir.path is defined
    
    - name: Move built binary into place
      ansible.builtin.copy:
        remote_src: yes
        mode: preserve
        src: "{{ build_dir.path }}/caddy"
        dest: /usr/bin/caddy.custom
      when: build_dir.path is defined
    
    - name: Remove build tempdir
      ansible.builtin.file:
        path: "{{ build_dir.path }}"
        state: absent
      when: build_dir.path is defined

    - name: Update-alternatives for caddy
      community.general.alternatives:
        link: /usr/bin/caddy
        name: caddy
        path: "{{ item[0] }}"
        priority: "{{ item[1]}}"
        state: present
      loop:
        - ["/usr/bin/caddy.default", 10]
        - ["/usr/bin/caddy.custom", 50]
      when: current_caddy_version is ansible.builtin.version(caddy_version, '!=')

    - name: Enable and start Caddy service
      ansible.builtin.service:
        name: caddy
        enabled: yes
        state: started
      when: caddy_version_output.rc == 0

    - name: Transfer the main Caddyfile
      ansible.builtin.template:
        src: templates/caddy/main.Caddyfile.j2
        dest: /etc/caddy/Caddyfile
      notify: Reload caddy

    - name: Create directory for sub-sites
      ansible.builtin.file:
        path: /etc/caddy/sites
        state: directory

- name: Deploy Caddy site configs
  hosts: homeserver
  become: True
  tags:
    - sites
    - caddy
    - proxy

  handlers:
    - name: Reload caddy
      ansible.builtin.service:
        name: caddy
        state: reloaded

  vars_files:
    - vars/port_usage.yml
    - vars/shared_vars.yml
    - vars/credentials.yml

  tasks:
      # Deploys all .Caddyfile.j2 files in templates/caddy/sites
    - name: Deploy site configs
      template:
        src: '{{ item }}'
        dest: '/etc/caddy/sites/{{ (item | basename | splitext)[0] }}'
      with_fileglob:
        - templates/caddy/sites/*.Caddyfile.j2
      notify:
        - Reload caddy

- name: Network storage
  hosts: homeserver
  become: true
  tags:
    - storage

  tasks:
    - name: Install NFS dependencies
      ansible.builtin.package:
        name: nfs-common
        state: present

    - name: Setup and mount NAS share
      ansible.posix.mount:
        src: hexos1.home:/mnt/HDDs/microservices
        path: /mnt/hexos
        boot: yes
        fstype: nfs
        state: mounted
        opts: rw,sync,hard

- name: Install Nextcloud AiO
  hosts: homeserver
  become: True
  tags:
    - nextcloud

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  tasks:
    - name: Create nextcloud network
      community.docker.docker_network:
        name: nextcloud

    - name: Create the local folder the nextcloud data dir
      ansible.builtin.file:
        path: /mnt/hexos/nextcloud
        state: directory
        mode: '0750'
        owner: 'www-data'
        group: 'root'

    - name: Create nextcloud data volume
      community.docker.docker_volume:
        name: nextcloud_aio_nextcloud_datadir
        driver: local
        driver_options:
          device: /mnt/hexos/nextcloud
          type: "none"
          o: bind
        state: present
        labels:
          application: "nextcloud"
          managed_by: "ansible"
    
    - name: Create nextcloud config volume
      community.docker.docker_volume:
        name: nextcloud_aio_mastercontainer
        state: present
        labels:
          application: "nextcloud"
          managed_by: "ansible"

    - name: Start Nextcloud AiO
      community.docker.docker_container:
        name: nextcloud-aio-mastercontainer
        image: ghcr.io/nextcloud-releases/all-in-one:latest
        init: true
        restart_policy: 'unless-stopped'
        ports:
          - '{{ portmap.nextcloud.AIO_MGMT }}:8080'
        networks:
          - name: nextcloud
          - name: bridge

        volumes:
          - 'nextcloud_aio_mastercontainer:/mnt/docker-aio-config'
          - '/var/run/docker.sock:/var/run/docker.sock:ro'
        env:
            NEXTCLOUD_DATADIR: 'nextcloud_aio_nextcloud_datadir'
            APACHE_PORT: "{{ portmap.nextcloud.APACHE | string }}"
            APACHE_IP_BINDING: '0.0.0.0'
            APACHE_ADDITIONAL_NETWORK: ''
            SKIP_DOMAIN_VALIDATION: 'false'
            TALK_PORT: "{{ portmap.nextcloud.TALK | string }}"

        # Defaults
        auto_remove: false
        detach: true
        interactive: false
        memory: "0"
        paused: false
        privileged: false
        read_only: false
        tty: false

- name: Install thelounge (docker)
  hosts: homeserver
  become: True
  tags:
    - thelounge
    - irc

  vars_files:
    - vars/shared_vars.yml
    - vars/port_usage.yml
    - vars/credentials.yml

  tasks:
    # todo: Remember to chmod 'o+x' all the folders leading to the upload dir
    - name: Create the local folder for thelounge data
      ansible.builtin.file:
        path: /mnt/hexos/thelounge
        state: directory
        mode: '0755'
        owner: '1000'
        group: '1000'

    - name: Create thelounge data volume
      community.docker.docker_volume:
        name: thelounge_data
        driver: local
        driver_options:
          device: /mnt/hexos/thelounge
          type: "none"
          o: bind
        state: present
        labels:
          application: "thelounge"
          managed_by: "ansible"
        
    - name: Get data volume path
      community.docker.docker_volume_info:
        name: thelounge_data
      register: thelounge_data_volume_info
    
    - name: Set up config
      template:
        src: templates/thelounge/config.js.j2
        dest: '/mnt/hexos/thelounge/config.js'

    - name: Start thelounge container
      community.docker.docker_container:
        name: thelounge
        image: ghcr.io/thelounge/thelounge:4.5.2
        ports: 
          - '{{ portmap.thelounge[0] }}:9000'
        network_mode: bridge
        restart_policy: 'unless-stopped'
        volumes:
          - 'thelounge_data:/var/opt/thelounge'
      
        container_default_behavior: 'no_defaults'
        tty: no
        read_only: no
        privileged: no
        paused: no
        memory: "0"
        interactive: no
        init: no
        detach: yes
        auto_remove: no

- name: Install unifi OS
  hosts: homeserver
  become: true
  tags:
    - unifi

  vars_files:
    - vars/port_usage.yml

  handlers:
    - name: Reload caddy
      ansible.builtin.service:
        name: caddy
        state: reloaded

  tasks:
    - name: Make directory to keep script in
      ansible.builtin.file:
        path: /opt/GlennRUnifi/
        state: directory

    - name: Get GlennR install script
      ansible.builtin.get_url:
        url: https://get.glennr.nl/unifi/install/unifi-os-server-5.1.15.sh
        dest: /opt/GlennRUnifi/unifi-os-server.sh
        checksum: sha256:e84cf4a154b5546edf2c153d79a2dd3df6b61fd6de191b64a40be55a0c16b42a
    
    - name: Get GlennR update script
      ansible.builtin.get_url:
        url: https://get.glennr.nl/unifi/update/unifi-update.sh
        dest: /opt/GlennRUnifi/unifi-update.sh
        checksum: sha256:b5107851f5ae9e6e13b6cbc12987429e5b0eafe0810f24f226b3b9b1eb717d3b

    - name: Ensure dependencies are installed
      ansible.builtin.package:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Run GlennR script
      ansible.builtin.command: /bin/bash unifi-os-server.sh --skip --install-unifi-os-server 
      args:
        chdir: /opt/GlennRUnifi/
        creates: /var/lib/uosserver/bin/uosserver-service
    
    - name: Run GlennR update script
      ansible.builtin.command: /bin/bash unifi-update.sh --skip
      args:
        chdir: /opt/GlennRUnifi/
        removes: /var/lib/uosserver/bin/uosserver-service

