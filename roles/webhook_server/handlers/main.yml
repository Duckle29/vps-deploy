---
- name: reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: ansible_facts['service_mgr'] == 'systemd'

- name: restart webhook server
  become: true
  ansible.builtin.service:
    name: 'webhook_server'
    state: restarted
  when: ansible_facts['service_mgr'] == 'systemd'
