---
portmap:

  # Uptime Kuma (home instance, status2.mikkel.cc). Bound to 127.0.0.1.
  kuma:
    webui: 3001

  # Pelican (pelican.dev) is an open source game server management panel
  # (successor to Pterodactyl). The panel gives a web UI, users and per-server
  # resource limits; its "wings" daemon runs each game server as a Docker
  # container and serves SFTP. Not deployed, ports are reserved for later.
  pelican:
    panel: 8085
    wings: 4433
    sftp: 2022

  immich:
    server: 2283
    ml: 3003

  thelounge:
    - 9000

  nextcloud:
    AIO_MGMT: 8100
    APACHE: 11000
    TALK: 3479

  # UniFi OS Server. Listening on the homeserver (checked 2026-10-17 with ss), all
  # of them besides the ones below are taken: 5671, 5514/udp, 6789, 8444 (self-signed
  # unifi.local certificate), 8880-8882, 9543, 10001/udp, 10003/udp
  unifi:
    - 11443 # main gui
    - 3478  # STUN for adoption and other
    - 8080  # Inform http
    - 8444  # taken by UniFi OS, do not use

  unms:
    - 9443

  joplin:
    - 30027

  usdn:
    - 8443
    - 6789
    - 8843
    - 8880
    - 8080

  mariadb:
    - 3306
  
  webhook_serv:
    - 5012
  
  deluged:
    - 3769
  
  mongodb:
    - 27017
    - 27117

  shlink:
    - 8200

  bepasty:
    - 8300

  cocalc:
    - 8400

  bitwarden:
    - 8500
    - 8512

  # Update server container (loopback), nginx with 512 B TLS records for the
  # devices, and the Caddy-internal loopback site that owns esp.mikkel.cc's cert
  esp_ota:
    - 5051
    - 8445
    - 8447

  # nginx with 512 B TLS records, serves certs.ar straight to the ESPs
  esp_certs:
    - 8443
    # Caddy-internal site on loopback whose only job is to own the certificate
    - 8446

  gitea:
    - 3000
    - 3222

  vernemq:
    - 8884
  
  # 8083 websockets (loopback, behind Caddy on mqtt.mikkel.cc:443), 8883 MQTTS
  mosquitto:
    - 8083
    - 8883

  syncplay:
    - 8999
  
  snuletek:
    - 7443
  
  mc_pomodoro:
    - 25565
    - 25575
    - 19132

  influxDB:
    - 8086
  
  inventree:
    - 8000