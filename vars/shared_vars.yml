cert_dir: '/etc/ssl/ansible'
domain: 'mikkel.cc'
domain_mikkelcc: 'mikkel.cc'
autotorrent_webroot: '/srv/autotorrent.mikkel.cc'
mikkelcc_webroot: '/srv/mikkel.cc'
blog_webroot: '/srv/blog.mikkel.cc'
snuletekorg_webroot: '/srv/snuletek.org'
shlink_domain: 'sche.cc'
wifir_webroot: '/srv/wifir.mikkel.cc'
mqtt_container_name: 'duQTT-Mosquitto'
caddy_version: 'v2.11.2'
# v0.2.3 rejects the newer Cloudflare API token format (cfut_..., 53 chars) with
# "API token appears invalid"; v0.2.4 accepts it.
caddy_cloudflare_plugin_version: 'v0.2.4'
nfs_server: 'hexos1.home'
nfs_share: '/mnt/HDDs/microservices'
esp_certs_host: 'espcerts.mikkel.cc'
esp_certs_dir: '/srv/espcerts'
# Not esp.mikkel.cc: devices on the old firmware still update from there (VPS, :443),
# and the new firmware has to find the new server under a name that can go live first.
esp_ota_host: 'espota.mikkel.cc'
esp_ota_dir: '/srv/esp-ota'
mqtt_host: 'mqtt.mikkel.cc'
mosquitto_dir: '/srv/mosquitto'
