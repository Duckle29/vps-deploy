---
# Nextcloud for the NextTask beta testers (nexttask.mikkel.cc) on VM 106.
#
# proxmox.yml (tag vms) creates the VM; this sets up the inside: Docker, then
# Nextcloud (official image) + Postgres + Redis + the cron container. The
# homeserver's Caddy terminates TLS and proxies to port {{ nexttask_cloud_port }}
# here (templates/caddy/sites/nexttask.Caddyfile.j2, deploy_homeserver.yml --tags sites).
#
# Tester accounts tester01..tester30 come from credentials.nexttask_cloud.testers;
# new ones are created with two seeded task lists (nc_seed_lists/nc_seed_tasks).
# Every account gets the default quota below and starts with an empty folder.
#
# Needs credentials.nexttask_cloud.{admin_password,postgres_password,smtp.password}
# (the last one is the Migadu mailbox noreply@sche.cc) and the inventory group
# nexttask_cloud. Run:
#   export SSH_AUTH_SOCK=$XDG_RUNTIME_DIR/gnupg/S.gpg-agent.ssh
#   ansible-playbook deploy_nexttask_cloud.yml
- name: Proxmox guest agent
  hosts: nexttask_cloud
  become: true
  tags:
    - dependencies
    - guest-agent

  tasks:
    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Security updates for the VM itself; the containers are updated by
    # re-running this play (pull: yes on a major-version tag).
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

- name: Install and set up Docker-CE
  hosts: nexttask_cloud
  become: true
  tags:
    - dependencies
    - docker

  vars:
    docker_sdk: true
    docker_compose: true

  roles:
    - haxorof.docker_ce

- name: Nextcloud for NextTask testers
  hosts: nexttask_cloud
  become: true
  tags:
    - nextcloud

  vars_files:
    - vars/shared_vars.yml
    - vars/credentials.yml

  vars:
    nc_image: 'nextcloud:35-apache'
    nc_postgres_version: '17'
    nc_redis_version: '7-alpine'
    nc_admin_user: admin
    nc_default_quota: '100 MB'
    # The homeserver's Caddy, the only proxy in front of this.
    nc_trusted_proxy: 192.168.6.203
    # Migadu: implicit TLS on 465, the mailbox address is the login.
    nc_smtp_host: smtp.migadu.com
    nc_smtp_port: 465
    nc_smtp_user: noreply@sche.cc
    nc_apps: [tasks, calendar]
    # NextTask needs only core (Login Flow v2, app passwords) and dav. Everything
    # else that can be disabled is, except Tasks/Calendar for the testers and
    # the security/admin apps (password_policy, bruteforcesettings, twofactor_totp,
    # notifications, logreader, serverinfo, updatenotification). Less PHP exposed,
    # and no versions/trash eating the 100 MB quotas.
    nc_disabled_apps:
      - activity
      - app_api
      - circles
      - comments
      - contactsinteraction
      - dashboard
      - federation
      - files_downloadlimit
      - files_lock
      - files_pdfviewer
      - files_reminders
      - files_sharing
      - files_trashbin
      - files_versions
      - firstrunwizard
      - nextcloud_announcements
      - office
      - photos
      - privacy
      - recommendations
      - related_resources
      - sharebymail
      - support
      - survey_client
      - systemtags
      - text
      - user_status
      - weather_status
      - webhook_listeners
    # tester01..tester30 -> password, in credentials.yml (gitignored)
    nc_testers: "{{ credentials.nexttask_cloud.testers | default({}) }}"
    nc_seed_users: "{{ nc_new_testers }}"
    # Two lists every new tester starts with. Tasks refer to their list by id
    # and to a parent task by uid (RELATED-TO;RELTYPE=PARENT, as NextTask uses).
    nc_seed_lists:
      - {id: getting-started, name: Getting started, color: '#0082c9'}
      - {id: weekend-project, name: Weekend project, color: '#e9a23b'}
    nc_seed_tasks:
      - {list: getting-started, uid: gs-1, summary: Tick this task off}
      - list: getting-started
        uid: gs-2
        summary: Open a task to edit its title and notes
        notes: Tasks sync with Nextcloud over CalDAV, so changes also show up in the Tasks app on the web.
      - {list: getting-started, uid: gs-3, summary: Tasks can have subtasks}
      - {list: getting-started, uid: gs-3a, summary: Like this one, parent: gs-3}
      - {list: getting-started, uid: gs-3b, summary: And they can nest deeper, parent: gs-3}
      - {list: getting-started, uid: gs-3b1, summary: Three levels down, parent: gs-3b}
      - {list: getting-started, uid: gs-4, summary: Drag a task to reorder it or move it under another one}
      - {list: getting-started, uid: gs-5, summary: This one is due in two days, due_days: 2}
      - {list: getting-started, uid: gs-6, summary: This one is already done, done: true}
      - {list: weekend-project, uid: wp-1, summary: Build a bookshelf, priority: 1}
      - {list: weekend-project, uid: wp-1a, summary: Measure the wall, parent: wp-1, done: true}
      - {list: weekend-project, uid: wp-1b, summary: Buy wood and screws, parent: wp-1, due_days: 1}
      - {list: weekend-project, uid: wp-1c, summary: Cut and sand the boards, parent: wp-1}
      - {list: weekend-project, uid: wp-1d, summary: Paint, parent: wp-1}
      - {list: weekend-project, uid: wp-2, summary: Groceries}
      - {list: weekend-project, uid: wp-2a, summary: Coffee, parent: wp-2}
      - {list: weekend-project, uid: wp-2b, summary: Bread, parent: wp-2}
      - {list: weekend-project, uid: wp-2c, summary: Apples, parent: wp-2}
      - {list: weekend-project, uid: wp-3, summary: Call the hardware store about delivery, due_days: 3}
    # Lowest PHP release per branch with the fixes for CVE-2026-109618/109619.
    php_minimum:
      '8.2': '8.2.35'
      '8.3': '8.3.36'
      '8.4': '8.4.27'
      '8.5': '8.5.12'
    occ: docker exec -u www-data nexttask-nextcloud php occ

  tasks:
    - name: Create the network
      community.docker.docker_network:
        name: nexttask

    - name: Create the volumes
      community.docker.docker_volume:
        name: '{{ item }}'
        labels:
          application: "nexttask-cloud"
          managed_by: "ansible"
      loop: [nexttask_db, nexttask_html]

    - name: Start the database
      community.docker.docker_container:
        name: nexttask-db
        image: 'postgres:{{ nc_postgres_version }}'
        pull: yes
        networks:
          - name: nexttask
        restart_policy: 'unless-stopped'
        volumes:
          - 'nexttask_db:/var/lib/postgresql/data'
        env:
          POSTGRES_DB: nextcloud
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: '{{ credentials.nexttask_cloud.postgres_password }}'

        container_default_behavior: 'no_defaults'
        detach: yes

    - name: Start Redis
      community.docker.docker_container:
        name: nexttask-redis
        image: 'redis:{{ nc_redis_version }}'
        pull: yes
        networks:
          - name: nexttask
        restart_policy: 'unless-stopped'

        container_default_behavior: 'no_defaults'
        detach: yes

    # The image installs Nextcloud on the first start from these variables, and
    # upgrades it on a later start with a newer image.
    - name: Start Nextcloud
      community.docker.docker_container:
        name: nexttask-nextcloud
        image: '{{ nc_image }}'
        pull: yes
        networks:
          - name: nexttask
        ports:
          - '{{ nexttask_cloud_port }}:80'
        restart_policy: 'unless-stopped'
        volumes:
          - 'nexttask_html:/var/www/html'
        env:
          POSTGRES_HOST: nexttask-db
          POSTGRES_DB: nextcloud
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: '{{ credentials.nexttask_cloud.postgres_password }}'
          REDIS_HOST: nexttask-redis
          NEXTCLOUD_ADMIN_USER: '{{ nc_admin_user }}'
          NEXTCLOUD_ADMIN_PASSWORD: '{{ credentials.nexttask_cloud.admin_password }}'
          NEXTCLOUD_TRUSTED_DOMAINS: '{{ nexttask_cloud_host }}'
          TRUSTED_PROXIES: '{{ nc_trusted_proxy }}'
          OVERWRITEPROTOCOL: https
          OVERWRITECLIURL: 'https://{{ nexttask_cloud_host }}'
          APACHE_DISABLE_REWRITE_IP: '1'
          PHP_UPLOAD_LIMIT: 100M

        container_default_behavior: 'no_defaults'
        detach: yes

    - name: Start the background job runner
      community.docker.docker_container:
        name: nexttask-cron
        image: '{{ nc_image }}'
        pull: yes
        entrypoint: /cron.sh
        networks:
          - name: nexttask
        restart_policy: 'unless-stopped'
        volumes:
          - 'nexttask_html:/var/www/html'

        container_default_behavior: 'no_defaults'
        detach: yes

    - name: Read the PHP version
      ansible.builtin.command: docker exec nexttask-nextcloud php -r 'echo PHP_VERSION;'
      register: nc_php
      changed_when: false

    - name: PHP must have the CVE-2026-109618/109619 fixes
      ansible.builtin.assert:
        that:
          - nc_php.stdout is version(php_minimum[nc_php.stdout.split('.')[:2] | join('.')], '>=')
        fail_msg: "{{ nc_image }} runs PHP {{ nc_php.stdout }}, which is not patched"
        quiet: true

    - name: Wait for the installation to finish
      ansible.builtin.command: "{{ occ }} status --output=json"
      register: nc_status
      until: nc_status.rc == 0 and (nc_status.stdout | from_json).installed
      retries: 30
      delay: 10
      changed_when: false

    # Testers can't see each other in the share dialog, start with an empty
    # folder (no sample files eating the quota), and get the default quota.
    - name: Set the server settings
      ansible.builtin.command: "{{ occ }} {{ item }}"
      loop:
        - config:app:set files default_quota --value='{{ nc_default_quota }}'
        - config:app:set core shareapi_allow_share_dialog_user_enumeration --value=no
        - config:system:set skeletondirectory --value=''
        - config:system:set templatedirectory --value=''
        - config:system:set default_phone_region --value=DK
        - config:system:set maintenance_window_start --type=integer --value=1
        - background:cron
        # mimetype migrations etc.; slow on big instances, seconds here
        - maintenance:repair --include-expensive
      changed_when: false

    - name: Check the SMTP credentials
      ansible.builtin.assert:
        that:
          - (credentials.nexttask_cloud.smtp | default({})).password | default('', true) | string | length > 0
        fail_msg: >-
          Create the Migadu mailbox {{ nc_smtp_user }} and put its password in
          credentials.nexttask_cloud.smtp.password
        quiet: true

    # Outgoing mail (password resets, share notifications) through Migadu, one
    # mailbox per service like inventree@ and ciao@. no_log: the password is an
    # occ argument.
    - name: Set up outgoing mail
      ansible.builtin.command:
        argv: "{{ ['docker', 'exec', '-u', 'www-data', 'nexttask-nextcloud', 'php', 'occ'] + item }}"
      loop:
        - [config:system:set, mail_smtpmode, --value=smtp]
        - [config:system:set, mail_smtphost, '--value={{ nc_smtp_host }}']
        - [config:system:set, mail_smtpport, --type=integer, '--value={{ nc_smtp_port }}']
        - [config:system:set, mail_smtpsecure, --value=ssl]
        - [config:system:set, mail_smtpauth, --type=boolean, --value=true]
        - [config:system:set, mail_smtpname, '--value={{ nc_smtp_user }}']
        - [config:system:set, mail_smtppassword, '--value={{ credentials.nexttask_cloud.smtp.password | string }}']
        - [config:system:set, mail_from_address, '--value={{ nc_smtp_user.split("@")[0] }}']
        - [config:system:set, mail_domain, '--value={{ nc_smtp_user.split("@")[1] }}']
      changed_when: false
      no_log: true

    - name: List the apps
      ansible.builtin.command: "{{ occ }} app:list --output=json"
      register: nc_app_list
      changed_when: false

    - name: Install the apps the testers need
      ansible.builtin.command: "{{ occ }} app:install {{ item }}"
      loop: "{{ nc_apps }}"
      # `| list` because occ prints an empty group as [] rather than {}
      when: item not in ((nc_app_list.stdout | from_json).enabled | list) + ((nc_app_list.stdout | from_json).disabled | list)

    - name: Enable them
      ansible.builtin.command: "{{ occ }} app:enable {{ item }}"
      loop: "{{ nc_apps }}"
      when: item in (nc_app_list.stdout | from_json).disabled

    - name: Disable the apps that are only clutter here
      ansible.builtin.command: "{{ occ }} app:disable {{ item }}"
      loop: "{{ nc_disabled_apps }}"
      when: item in (nc_app_list.stdout | from_json).enabled

    # --- Tester accounts ------------------------------------------------------
    - name: List the accounts
      ansible.builtin.command: "{{ occ }} user:list --output=json --limit=1000"
      register: nc_user_list
      changed_when: false

    - name: Pick the testers that don't exist yet
      ansible.builtin.set_fact:
        nc_new_testers: "{{ nc_testers | list | difference(nc_user_list.stdout | from_json | list) | sort }}"

    # The password goes in through the environment, not the command line.
    - name: Create the missing tester accounts
      community.docker.docker_container_exec:
        container: nexttask-nextcloud
        user: www-data
        argv: [php, occ, user:add, --password-from-env, --display-name, "Tester {{ item[-2:] }}", "{{ item }}"]
        env:
          OC_PASS: "{{ nc_testers[item] }}"
      loop: "{{ nc_new_testers }}"
      no_log: true

    # Only new accounts get the lists, so a tester's deletions don't come back
    # on the next run. -e '{"nc_seed_users": ["tester07"]}' re-seeds one;
    # existing lists and tasks are left alone (405 / If-None-Match).
    - name: Create the seeded task lists
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nexttask_cloud_port }}/remote.php/dav/calendars/{{ item.0 }}/{{ item.1.id }}/"
        method: MKCALENDAR
        headers:
          Host: "{{ nexttask_cloud_host }}"
          Content-Type: application/xml; charset=utf-8
        url_username: "{{ item.0 }}"
        url_password: "{{ nc_testers[item.0] }}"
        force_basic_auth: true
        body: >-
          <c:mkcalendar xmlns:d="DAV:" xmlns:c="urn:ietf:params:xml:ns:caldav"
          xmlns:a="http://apple.com/ns/ical/"><d:set><d:prop>
          <d:displayname>{{ item.1.name }}</d:displayname>
          <a:calendar-color>{{ item.1.color }}</a:calendar-color>
          <c:supported-calendar-component-set><c:comp name="VTODO"/></c:supported-calendar-component-set>
          </d:prop></d:set></c:mkcalendar>
        status_code: [201, 405]
      loop: "{{ nc_seed_users | product(nc_seed_lists) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1.id }}"

    - name: Fill them with tasks
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nexttask_cloud_port }}/remote.php/dav/calendars/{{ item.0 }}/{{ item.1.list }}/seed-{{ item.1.uid }}.ics"
        method: PUT
        headers:
          Host: "{{ nexttask_cloud_host }}"
          Content-Type: text/calendar; charset=utf-8
          If-None-Match: '*'
        url_username: "{{ item.0 }}"
        url_password: "{{ nc_testers[item.0] }}"
        force_basic_auth: true
        body: "{{ lookup('template', 'templates/nexttask/seed-task.ics.j2', template_vars={'t': item.1}) | regex_replace('\\r?\\n', '\\r\\n') }}"
        status_code: [201, 204, 412]
      loop: "{{ nc_seed_users | product(nc_seed_tasks) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1.list }}/{{ item.1.uid }}"
